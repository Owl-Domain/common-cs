name: .NET CI

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages


jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository.
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/
            .editorconfig

      - name: Setup the .NET development environment.
        uses: actions/setup-dotnet@v6

      - name: Restore the project dependencies.
        working-directory: src/
        run: dotnet restore

      - name: Build the source directory.
        working-directory: src/
        run: dotnet build --no-restore --warnaserror --configuration Release /p:ContinuousIntegrationBuild=true /p:noWarn=IDE0055

      - name: Package the projects.
        working-directory: src/
        run: dotnet pack --no-build --warnaserror --configuration Release /p:ContinuousIntegrationBuild=true /p:noWarn=IDE0055 --output "${{ runner.temp }}/packages/"

      - name: Upload NuGet packages as an artifact.
        uses: actions/upload-artifact@v7
        with:
          name: packages
          if-no-files-found: error
          path: "${{ runner.temp }}/packages/"

      - name: NuGet login.
        id: login
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # NuGet 'Trusted Publishing' will take care of ensure only the expected packages will be uploaded.
      - name: NuGet push.
        run: |
          dotnet nuget push "${{ runner.temp }}/packages/*" \
          --skip-duplicate \
          --source https://api.nuget.org/v3/index.json \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
